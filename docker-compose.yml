services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: steh
      POSTGRES_USER: steh
      POSTGRES_PASSWORD: steh
    ports:
      - "5433:5432"
    volumes:
      - steh_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steh -d steh"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    image: steh-app:local
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://steh:steh@postgres:5432/steh
      LANGGRAPH_DATABASE_URL: postgresql://steh:steh@postgres:5432/steh?sslmode=disable
      RUN_MIGRATIONS: "false"
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: steh-app:local
    pull_policy: never
    volumes:
      # Shared implementation workspace so a recovered job finds its files (ADR-017).
      - steh_workspaces:/tmp/steh-workspaces
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://steh:steh@postgres:5432/steh
      LANGGRAPH_DATABASE_URL: postgresql://steh:steh@postgres:5432/steh?sslmode=disable
      RUN_MIGRATIONS: "false"
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: steh-app:local
    pull_policy: never
    volumes:
      # Shared implementation workspace so a recovered job finds its files (ADR-017).
      - steh_workspaces:/tmp/steh-workspaces
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://steh:steh@postgres:5432/steh
      LANGGRAPH_DATABASE_URL: postgresql://steh:steh@postgres:5432/steh?sslmode=disable
      RUN_MIGRATIONS: "false"
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully

  scanner:
    build:
      context: .
      dockerfile: scanner.Dockerfile
    image: steh-scanner:0.5.1
    profiles: ["build-only"]
    command: ["semgrep", "--version"]

volumes:
  steh_postgres_data:
  steh_workspaces:
