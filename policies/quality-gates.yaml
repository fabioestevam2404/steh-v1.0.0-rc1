version: "0.4"

rules:
  - id: AUDIT-001
    description: "Every workflow execution must produce evidence"
    check: "evidence_present"
    action: "BLOCK"

  - id: REQ-001
    description: "Requirements artifact must exist"
    check: "requirements_present"
    action: "BLOCK"

  - id: ARCH-001
    description: "Architecture artifact must exist before security review"
    check: "architecture_present"
    action: "BLOCK"

  - id: SPEC-001
    description: "Software specification must exist before architecture"
    check: "specification_present"
    action: "BLOCK"

  - id: SPEC-002
    description: "Specification requirements must have unique stable identifiers"
    check: "specification_requirements_identified"
    action: "BLOCK"

  - id: SPEC-003
    description: "Acceptance scenarios must use Given, When and Then"
    check: "acceptance_scenarios_structured"
    action: "BLOCK"

  - id: TRACE-001
    description: "Every specified requirement must map to acceptance scenarios"
    check: "requirements_traceable"
    action: "BLOCK"

  - id: SEC-001
    description: "Critical security findings are prohibited"
    check: "no_critical_security_findings"
    action: "BLOCK"

  - id: SEC-002
    description: "High security findings require review"
    check: "no_high_security_findings"
    action: "HUMAN_REVIEW"

  - id: SEC-003
    description: "Threat model must exist"
    check: "threat_model_present"
    action: "BLOCK"

  - id: SEC-004
    description: "Security requirements must exist"
    check: "security_requirements_present"
    action: "BLOCK"

  - id: IMPL-001
    description: "Implementation artifact must exist after implementation"
    check: "implementation_present"
    action: "BLOCK"

  - id: TESTPLAN-001
    description: "Test plan must exist before implementation"
    check: "test_plan_present"
    action: "BLOCK"

  - id: TESTPLAN-002
    description: "Test plan must cover every specified requirement"
    check: "test_plan_covers_requirements"
    action: "BLOCK"

  - id: TESTPLAN-003
    description: "Test plan must include negative security coverage"
    check: "negative_security_tests_present"
    action: "BLOCK"

  - id: TEST-001
    description: "Generated implementation must pass controlled tests"
    check: "tests_passed"
    action: "REWORK"

  - id: SCAN-001
    description: "Generated implementation must have no high or critical scanner findings"
    check: "scanners_passed"
    action: "REWORK"
