name: STEH Release Validation

on:
  push:
    tags:
      - "v*-alpha"

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: steh
          POSTGRES_USER: steh
          POSTGRES_PASSWORD: steh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steh -d steh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://steh:steh@localhost:5432/steh
      LANGGRAPH_DATABASE_URL: postgresql://steh:steh@localhost:5432/steh?sslmode=disable
      LLM_MODE: stub
      LLM_MODEL: test
      POLICY_FILE: policies/quality-gates.yaml

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Migrations
        run: alembic upgrade head

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app

      - name: Test
        run: pytest -q
