name: STEH RC Validation

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: steh
          POSTGRES_USER: steh
          POSTGRES_PASSWORD: steh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U steh -d steh"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://steh:steh@localhost:5432/steh
      LANGGRAPH_DATABASE_URL: postgresql://steh:steh@localhost:5432/steh?sslmode=disable
      LLM_MODE: stub
      LLM_MODEL: test
      POLICY_FILE: policies/quality-gates.yaml
      AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Validate RC2 and generate evidence
        run: >-
          python scripts/validate_rc.py
          --allow-database-reset
          --output artifacts/rc2-validation-evidence.json
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rc2-validation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/rc2-validation-evidence.json
          if-no-files-found: error
          retention-days: 30
