name: STEH RC Validation

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: steh
          POSTGRES_USER: steh
          POSTGRES_PASSWORD: steh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U steh -d steh"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://steh:steh@localhost:5432/steh
      LANGGRAPH_DATABASE_URL: postgresql://steh:steh@localhost:5432/steh?sslmode=disable
      LLM_MODE: stub
      LLM_MODEL: test
      POLICY_FILE: policies/quality-gates.yaml
      AUTH_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - name: Migration upgrade
        run: alembic upgrade head
      - name: Migration roundtrip
        run: |
          alembic downgrade -1
          alembic upgrade head
      - run: ruff check .
      - run: mypy app
      - run: pytest -q
      - name: Build scanner image
        run: docker build -f scanner.Dockerfile -t steh-scanner:0.5.1 .
